services:
  mictlanx-router-0x:
    image: nachocode/mictlanx:router-0.1.0a2
    container_name: mictlanx-router-0x
    restart: unless-stopped
    env_file:
      - .env.mictlanx.dev
    networks:
      - axo-net
      -traefik-pub
    #ports:
    #  - "60667:60667"
    volumes:
      - mictlanx-router-0x-logs:/log

    # command: gunicorn --worker-class uvicorn.workers.UvicornWorker  mictlanxrouter.server:app --bind ${MICTLANX_ROUTER_HOST-0.0.0.0}:${MICTLANX_ROUTER_PORT-60666}  --workers ${MICTLANX_MAX_WORKERS-1}
    # command: sleep infinity;
    command: > 
      sh -c 'gunicorn --worker-class uvicorn.workers.UvicornWorker
      mictlanxrouter.server:app
      --bind ${MICTLANX_ROUTER_HOST-0.0.0.0}:${MICTLANX_ROUTER_PORT-60666}  
      --workers ${MICTLANX_MAX_WORKERS-1}'

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:60666/docs"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - "node.labels.node_id == gamma"
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 4G
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-pub"

        - "traefik.http.routers.mxrouterprod.rule=Host(`apix.tamps.cinvestav.mx`) && PathPrefix(`/mictlanxx`)"
        - "traefik.http.routers.mxrouterprod.entrypoints=websecure"
        - "traefik.http.routers.mxrouterprod.tls=true"
        - "traefik.http.routers.mxrouterprod.tls.certresolver=resolverx"
        - "traefik.http.routers.mxrouterprod.middlewares=strip-api-prefixprod"

        - "traefik.http.middlewares.strip-api-prefixprod.stripprefix.prefixes=/mictlanxx"

        - "traefik.http.services.mxrouterprod.loadbalancer.server.port=60667"

  mictlanx-summoner-0x:
    image: nachocode/mictlanx:summoner
    container_name: mictlanx-summoner-0x
    hostname: mictlanx-summoner-0x
    privileged: true
    #ports:
    #  - 15000:15000
    environment:
      - USER_ID=1001
      - GROUP_ID=1002
      - DOCKER_GID=1001
      - BASE_PATH=${BASE_PATH-/app/mictlanx}
      - BIN_NAME=summoner
      - NODE_ID=mictlanx-summoner-0x
      - NODE_PORT=15000
      - IP_ADDRESS=mictlanx-summoner-0x
      - SERVER_IP_ADDR=0.0.0.0
      - LOG_PATH=${BASE_PATH-/app/mictlanx}/log
      - LOCAL_PATH=${BASE_PATH-/app/mictlanx}/local
      - DATA_PATH=${BASE_PATH-/app/mictlanx}/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mictlanx-summoner-0x:/mictlanx
    networks:
      - axo-net
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - "node.labels.node_id == gamma"
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
  mictlanx-rm-0:
    image: ${MICTLANX_RM_IMAGE:-nachocode/mictlanx:rm-0.1.0a2.nb1}
    container_name: mictlanx-rm-0
    restart: unless-stopped
    networks: [axo-net]
    #ports:
    #  - "5555:5555"
    volumes:
      - mictlanx-rm-dbx:/mictlanx/db
    command: ["python", "-m", "mictlanxrm.main"]
    environment:
      # === SPM (ZeroMQ) ===
      MICTLANX_PROTOCOL: "tcp"
      MICTLANX_IP_ADDR: "0.0.0.0"
      MICTLANX_PORT: "5555"
      MICTLANX_DEBUG: "0"
      MICTLANX_GC_TIMEOUT: "60s"
      LOCAL_STORE_PATH: "/mictlanx/db/x.json"

      # === Summoner ===
      SUMMONER_IP_ADDR: "mictlanx-summoner-0x"
      SUMMONER_PROTOCOL: "http"
      SUMMONER_PORT: "15000"
      SUMMONER_API_VERSION: "3"

      # === Peers bootstrapping ===
      MICTLANX_PEERS_PROTOCOL: "http"
      MICTLANX_PEERS_API_VERSION: "4"
      MICTLANX_PEERS: "mictlanx://mictlanx-peer-0x@mictlanx-peer-0x:35000,mictlanx-peer-1x@mictlanx-peer-1x:35001/?protocol=http&api_version=4"

      # === Default peer resources ===
      DEFAULT_PEER_MEMORY: "2GB"
      DEFAULT_PEER_DISK: "1000GB"
      DEFAULT_PEER_CPU: "1"

      # === Logging ===
      STORAGE_PEER_MANAGER_SHOW_LOGS: "INFO"

      # === StoragePeerManager params ===
      MAX_RETRIES: "2"
      MAX_IDLE_TIME: "10s"
      QUEUE_TICK_TIMEOUT: "5s"
      MAX_TIMEOUT_TO_RECOVER: "5s"
      SUMMONER_BASE_PORT: "35000"
      SUMMONER_BASE_PROTOCOL: "http"
      SUMMONER_PHYSICAL_NODES_INDEXES: "0,2,3,4,5,6,7,8,9"
      DEBUG: "True"  # internal SPM params flag (distinct from MICTLANX_DEBUG)
      SUMMONER_MODE: "docker"
      MAX_RECOVER_TIME_UNTIL_RESTART: "5sec"
      PEERS_CONFIG_PATH: ""
      MAX_TIMEOUT_TO_SAVE_PEER_CONFIG: "30min"
      PEER_ELASTIC: "True"
      SUMMONER_PEER_DOCKER_IMAGE: ${SUMMONER_PEER_DOCKER_IMAGE:-nachocode/mictlanx:peer-0.1.0a2}
      PEER_MIN_INTERVAL_TIME: "5"
      PEER_MAX_INTERVAL_TIME: "20"
      DAEMON_TICK_TIMEOUT: "10s"
      MAX_TIMEOUT_PEERS_HANDSHAKE: "30s"
      MAX_TIMEOUT_TO_GET_STATS: "10s"
      TICK_PEERS_HANDSHAKE: "5s"
      RECOVER_TICK_TIMEOUT: "10s"
      # RECOVER_TICK_TIMEOUT: "1m"
      SUMMONER_NETWORK_ID: "axo-net"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - "node.labels.node_id == disys9"
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
volumes:
  mictlanx-summoner-0x:
  mictlanx-router-0x-logs:
  mictlanx-rm-dbx:

networks:
  axo-net:
    external: true
  traefik-pub:
    external: true
